services:
  postgres:
    image: postgres:17
    container_name: auto-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port is configurable (POSTGRES_PORT in .env) in case 5432 is already taken.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for uploaded images (contact photos, company logos, avatars).
  # Console: http://localhost:9101 (login with MINIO_ROOT_USER / MINIO_ROOT_PASSWORD).
  minio:
    image: chainguard/minio:latest
    container_name: auto-crm-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data

  # Catches every email the API (and n8n) sends. Inbox: http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: auto-crm-mailpit
    restart: unless-stopped
    environment:
      # Skip the reverse-DNS lookup of each SMTP client (it adds seconds to every send).
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

volumes:
  postgres_data:
  minio_data:
